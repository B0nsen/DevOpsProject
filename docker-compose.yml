services:
  db:
    image: mysql:8.0
    restart: always
    environment:
      MYSQL_DATABASE: jysk_db
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3306:3306"

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "5000:8080"
    environment:
      - ConnectionStrings__DefaultConnection=Server=db;Database=jysk_db;Uid=root;Pwd=root;
    depends_on:
      - db

  frontend:
    build:
      context: ./Jysk/jysk.client
    ports:
      - "3000:3000"
    depends_on:
      - backend