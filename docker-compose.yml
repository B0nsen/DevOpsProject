services:
  db:
    image: mysql:8.0
    environment:
      MYSQL_DATABASE: jysk_db
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3306:3306"

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "5000:8080"
    depends_on:
      - db

  frontend:
    build:
      context: ./Jysk/jysk.client # Перевірте правильність цього шляху
    ports:
      - "3000:3000"
    depends_on:
      - backend